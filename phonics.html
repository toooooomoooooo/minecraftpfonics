:root{
  --wall:#EAF1FF;
  --dot:#D3E0FB;
  --card:#FFFFFF;
  --ink:#1E2340;
  --soft:#5B6385;
  --cobalt:#2747C8;
  --cobalt-2:#E0E7FF;
  --sun:#FFC83D;
  --good:#22A55A;
  --good-bg:#E3F7EA;
  --oops:#E0475B;
  --line:#C9D5F2;
  --f-letter:"InterSchool","Inter",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--wall);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.6px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--f-ja);font-size:17px;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:18px}

/* bubbly outlined letters like the video */
.bub{font-family:var(--f-letter);font-weight:800;color:var(--c,#2747C8);
  -webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;letter-spacing:.09em;line-height:1}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .bub{font-size:44px}
.brand h1{margin:0;font-size:26px;font-weight:900;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--soft);font-size:14px}
.back{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;display:inline-flex;gap:6px;align-items:center}

.panel{background:var(--card);border-radius:24px;border:2px solid var(--line);padding:18px}
.label{font-size:13px;font-weight:700;color:var(--soft);letter-spacing:.08em;margin:0 0 10px}

/* players */
.players{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.player{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.player[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:0 6px 0 var(--cobalt)}
.prow{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:32px;flex:none;background:var(--cobalt-2)}
.pname{font-size:21px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.pname input{font:inherit;width:100%;border:2px solid var(--cobalt);border-radius:10px;padding:2px 8px}
.edit{font-size:14px;color:var(--soft);padding:6px;flex:none}
.pmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.pill{border-radius:999px;padding:4px 12px;font-weight:700;background:var(--cobalt-2);color:var(--cobalt)}
.pill.lv{border:2px dashed var(--cobalt);background:transparent}
.today{display:flex;gap:6px;margin-left:auto}
.today i{width:22px;height:22px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-style:normal;font-size:13px}
.today i.on{border:0;background:var(--sun)}

/* range */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-family:var(--f-letter);font-weight:600;font-size:20px}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}

/* missions */
.missions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mission{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;position:relative;box-shadow:0 6px 0 var(--line);transition:transform .08s}
.mission:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.mission .step{font-size:13px;font-weight:700;color:var(--cobalt);letter-spacing:.06em}
.mission .ic{font-size:44px;line-height:1}
.mission b{font-size:22px;font-weight:900}
.mission small{color:var(--soft);font-size:14px;line-height:1.5}
.mission .done{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:24px;transform:rotate(-12deg);border:3px solid var(--ink)}
.extras{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
.wide-btn{background:var(--cobalt);color:#fff;border-radius:22px;padding:18px;font-weight:900;font-size:20px;display:flex;align-items:center;gap:12px;justify-content:center;box-shadow:0 6px 0 #1A2F8A}
.wide-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1A2F8A}

/* stamp card */
.stamps{display:grid;grid-template-columns:repeat(14,1fr);gap:6px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:clamp(11px,2vw,18px);position:relative}
.stamp.part{background:var(--cobalt-2);border-style:solid;border-color:var(--cobalt-2)}
.stamp.full{background:var(--sun);border:2px solid var(--ink)}
.stamp.is-today{outline:3px solid var(--cobalt);outline-offset:2px}
.stamp-days{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;font-size:11px;color:var(--soft);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
.streak{font-weight:900;font-size:18px}

/* video */
.vbox{background:#fff;border-radius:22px;overflow:hidden;border:3px solid var(--ink);position:relative}
.vend{position:absolute;inset:0;background:rgba(30,35,64,.55);display:grid;place-items:center;padding:12px}
.vend-card{background:var(--card);border-radius:24px;padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%}
.vend-t{display:flex;align-items:center;gap:12px;font-weight:900;font-size:24px}
.vend-t .bub{font-size:56px}
.vend .big{font-size:18px;padding:12px 20px}
.ve-cont{font-size:14px;color:var(--soft);text-decoration:underline;padding:4px}
.strip button.sel{border-color:var(--cobalt);background:var(--cobalt-2);box-shadow:0 4px 0 var(--cobalt)}
video{display:block;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px;gap:4px;width:max-content;max-width:100%}
.seg button{border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
/* letters in three rows: A–I, J–R, S–Z */
.strip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;padding:4px 0 8px}
.strip button{min-width:0;height:clamp(40px,9vw,56px);padding:0;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:clamp(15px,4.2vw,28px)}
.strip button .bub{letter-spacing:.03em}
.vtop{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.vtop button{height:48px;border-radius:14px;border:2px solid var(--line)}
.vtop button.all{width:auto;padding:0 18px;font-size:18px;font-weight:900;background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.vtop button.all.sel{box-shadow:0 4px 0 #1A2F8A}
.vtop button.all.quick{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.vtop button.all.quick.sel{box-shadow:0 4px 0 #C99400}
.vrow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* quiz */
.qtop{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.dots i.cur{border-color:var(--cobalt);background:var(--cobalt-2)}
.dots i.ok{background:var(--sun);border-color:var(--ink)}
.dots i.miss{background:var(--line);border-color:var(--line)}
.stage{background:var(--card);border-radius:30px;border:3px solid var(--line);padding:22px;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:300px}
.prompt{font-size:22px;font-weight:900;text-align:center;text-wrap:balance;margin:0}
.speaker{width:128px;height:128px;border-radius:50%;background:var(--cobalt);color:#fff;font-size:58px;display:grid;place-items:center;box-shadow:0 8px 0 #1A2F8A}
.speaker:active{transform:translateY(5px);box-shadow:0 3px 0 #1A2F8A}
.speaker.playing{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.cue{display:flex;flex-direction:column;align-items:center;gap:6px}
.cue .emo{font-size:96px;line-height:1}
.cue .bub{font-size:120px}
.cue .word{font-family:var(--f-letter);font-size:30px;font-weight:600}
.cue .word .blank{display:inline-block;width:.7em;border-bottom:4px solid var(--ink);margin-right:2px}
.choices{display:grid;gap:14px;width:100%;max-width:720px}
.choices.n3{grid-template-columns:repeat(3,1fr)}
.choices.n4{grid-template-columns:repeat(4,1fr)}
.choice{background:var(--card);border:3px solid var(--line);border-radius:26px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;box-shadow:0 7px 0 var(--line)}
.choice .bub{font-size:clamp(56px,11vw,96px)}
.choice .emo{font-size:clamp(52px,10vw,86px)}
.choice:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.choice.right{background:var(--good-bg);border-color:var(--good);box-shadow:0 7px 0 var(--good)}
.choice.wrong{opacity:.35;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* feedback / say-it card */
.say{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.say .row{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.say .bub{font-size:110px}
.say .emo{font-size:90px}
.say .ipa{font-family:var(--f-letter);font-size:26px;color:var(--soft)}
.yay{font-size:30px;font-weight:900;color:var(--good)}
.beats{display:flex;gap:16px;align-items:center}
.beats i{width:44px;height:44px;border-radius:50%;background:var(--cobalt-2);display:grid;place-items:center;font-style:normal;font-family:var(--f-letter);font-weight:700;color:var(--cobalt);transition:transform .12s,background .12s}
.beats i.hit{background:var(--cobalt);color:#fff;transform:scale(1.25)}
.beats i.you.hit{background:var(--sun);color:var(--ink)}
.beats .wbeat{width:auto;padding:0 16px;border-radius:999px}
.turn{font-size:24px;font-weight:900;min-height:1.5em;text-align:center}
.turn.you{color:#C27A00}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.big{border-radius:999px;padding:16px 30px;font-weight:900;font-size:22px;background:var(--cobalt);color:#fff;box-shadow:0 6px 0 #1A2F8A}
.big.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.big.gold{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 #C99400}
.big:active{transform:translateY(4px)}
.big[disabled]{opacity:.4;pointer-events:none}
.hint{color:var(--soft);font-size:15px;text-align:center}

/* board */
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:20px;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tile .bub{font-size:clamp(30px,6vw,52px)}
.tile .e{font-size:clamp(14px,2.6vw,22px)}
.tile .meter{position:absolute;left:10px;right:10px;bottom:6px;height:5px;border-radius:3px;background:var(--cobalt-2);overflow:hidden}
.tile .meter b{display:block;height:100%;background:var(--good)}
.tile.weak{border-color:var(--oops)}
.sheet{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.bigstars{font-size:64px;font-weight:900;font-family:var(--f-letter)}
.weak-list{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.weak-list button{background:var(--card);border:3px solid var(--oops);border-radius:16px;padding:6px 14px;display:flex;align-items:center;gap:6px}
.weak-list .bub{font-size:40px}
.gear{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;color:var(--soft);display:inline-flex;gap:6px;align-items:center}
.player{font:inherit;color:inherit;cursor:pointer}
.vlabel{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
/* correct-answer video */
.qvbox{position:relative;width:100%;max-width:560px;aspect-ratio:16/9;border-radius:20px;overflow:hidden;border:3px solid var(--ink);background:#fff}
.qvid{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.qv-play{position:absolute;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;background:var(--cobalt);color:#fff;font-size:42px;box-shadow:0 6px 0 #1A2F8A}
.say-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.say .bub.sm{font-size:54px}
.say .emo-sm{font-size:46px;line-height:1}
/* parent lock + settings */
.lock{position:fixed;inset:0;z-index:70;background:rgba(30,35,64,.6);display:grid;place-items:center;padding:16px}
.lock-card{background:var(--card);border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(340px,100%)}
.lock-t{margin:0;font-weight:900;font-size:20px}
.pin{display:flex;gap:14px}
.pin i{width:18px;height:18px;border-radius:50%;border:3px solid var(--cobalt)}
.pin i.on{background:var(--cobalt)}
.pin.bad{animation:shake .35s}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.keys button{height:64px;border-radius:18px;background:var(--cobalt-2);font-family:var(--f-letter);font-weight:600;font-size:28px;color:var(--ink)}
.keys button:active{background:var(--line)}
.keys .blank{visibility:hidden}
.set-title{margin:0;font-size:20px;font-weight:900}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.set-card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.set-card h3{margin:0;font-size:15px;color:var(--soft);letter-spacing:.06em}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:14px;font-weight:700}
.field input{font:inherit;font-size:20px;font-weight:700;border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;-webkit-user-select:text;user-select:text}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.avs button{width:44px;height:44px;border-radius:12px;font-size:24px;background:var(--cobalt-2);border:3px solid transparent}
.avs button[aria-pressed="true"]{border-color:var(--cobalt)}
.set-card .seg{width:100%}
.set-card .seg button{flex:1}
.reset{align-self:flex-start;color:var(--oops);font-weight:700;font-size:14px;border:2px solid var(--oops);border-radius:999px;padding:8px 14px}
.reset.arm{background:var(--oops);color:#fff}
@media (max-width:700px){.set-grid{grid-template-columns:1fr}}
.verdict{font-size:28px;font-weight:900;min-height:1.3em;text-align:center}
.verdict.ok{color:var(--good)}
.verdict.again{color:var(--oops)}
.heard{color:var(--soft);font-size:15px;min-height:1.3em;text-align:center;font-family:var(--f-letter)}
.big.mic{background:var(--oops);box-shadow:0 6px 0 #9E2333;font-size:24px;padding:18px 34px}
.big.mic.listening{animation:pulse .6s ease-in-out infinite alternate;opacity:1}
.qpick{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:4px}
.qbtn{width:100%;border-radius:16px;padding:12px 14px;font-weight:900;font-size:17px;text-align:left;background:var(--cobalt);color:#fff;box-shadow:0 4px 0 #1A2F8A}
.qbtn.voice{background:var(--oops);box-shadow:0 4px 0 #9E2333}
.qbtn:active{transform:translateY(3px)}
.player .edit{font-size:18px;padding:6px 8px;border-radius:10px;background:var(--cobalt-2);flex:none}
#go-board{width:100%}
.setrow{display:flex;justify-content:center;padding-top:8px}
@media (max-width:520px){.player .prow{flex-wrap:wrap;justify-content:space-between}.player .pname{order:3;flex-basis:100%;white-space:normal;word-break:break-all}}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:18px}
.logo .bub{font-size:72px}
.logo h1{margin:0;font-size:30px;font-weight:900;text-align:center}
.who-q{margin:8px 0 0;text-align:center;font-size:24px;font-weight:900;color:var(--cobalt)}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.who-card{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;min-width:0}
.who-card:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.who-av{width:min(120px,100%);aspect-ratio:1;border-radius:28px;border:3px solid var(--ink);background:var(--cobalt-2);display:grid;place-items:center;font-size:clamp(48px,14vw,70px)}
.who-name{font-size:clamp(17px,4.6vw,24px);font-weight:900;text-align:center;overflow-wrap:anywhere;width:100%}
.who-name input{font:inherit;width:100%;text-align:center;border:2px solid var(--cobalt);border-radius:12px;padding:4px}
.who-edit{border:2px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:900;font-size:16px;background:var(--card)}
.me{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--cobalt);color:#fff;border-radius:999px;padding:10px 24px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:28px;font-weight:900;min-width:0}
.me .av{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:36px;flex:none}
.me .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.change{width:100%;background:var(--oops);color:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:22px}
.change small{font-size:16px}
.change:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile-big{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:22px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;min-width:0}
button.tile-big:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ink)}
.tile-big .ic{font-size:64px;line-height:1}
.tile-big b{font-size:30px;font-weight:900}
.tile-big .qbtn{text-align:center;font-size:19px}
.tile-big .done{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-size:22px;transform:rotate(-12deg);border:3px solid var(--ink)}
.set-card .seg.col{flex-direction:column;border-radius:20px}
.set-card .seg.col button{border-radius:14px;padding:10px 14px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:50}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;z-index:60}

@media (max-width:760px){
  .missions{grid-template-columns:1fr}
  .extras{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(5,1fr)}
  .stamps,.stamp-days{gap:3px}
}
@media (max-width:520px){
  .player{padding:12px;gap:8px}
  .avatar{width:40px;height:40px;font-size:24px;border-radius:12px}
  .pname{font-size:17px}
  .today{margin-left:0}
  .choices.n4{grid-template-columns:repeat(2,1fr)}
  .choices.n3{grid-template-columns:repeat(3,1fr)}
  .board{grid-template-columns:repeat(4,1fr)}
  .stage{padding:16px}
  .cue .bub{font-size:96px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.embed .set-card label.field,html.embed .set-card .field:has(.avs){display:none!important}
</style>

      </div>

  <!-- RESULT -->

  </section>
</div>

let Q=null;
function startQuiz(){

  show('quiz');prepQV();renderDots('#qdots',Q.items,Q.i);askQ();

function distractors(l,n){
  let cand=pool().filter(x=>x.k!==l.k);
  if(cand.length<n-1)cand=LETTERS.filter(x=>x.k!==l.k);
  // avoid same-sound pair c/k in one question
  cand=cand.filter(x=>!((l.k==='c'&&x.k==='k')||(l.k==='k'&&x.k==='c')));
  return shuffle([l,...shuffle(cand).slice(0,n-1)]);
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
/* where each letter starts in quick3.mp4 (sound x3 + word) */
const QSTART=[0.0,3.604,7.241,10.878,14.481,18.252,21.788,25.392,29.062,32.666,36.336,40.107,43.677,47.247,50.851,54.688,58.292,61.895,65.499,69.136,72.773,76.276,79.947,83.617,87.22,90.857,94.494];

/* ---- lenient judging: right word, close to it, or a word with the same first sound ---- */
const SAME={a:['a','e'],b:['b','p','v'],c:['c','k','q'],d:['d','t'],e:['e','a','i'],f:['f','ph','v'],g:['g'],h:['h'],i:['i','e'],j:['j','g','ch'],k:['k','c','q'],l:['l','r'],m:['m','n'],n:['n','m'],o:['o','a','au'],p:['p','b'],q:['q','k','c'],r:['r','l','w'],s:['s','c','z'],t:['t','d'],u:['u','a','o'],v:['v','b','f'],w:['w','wh'],x:['x'],y:['y','j'],z:['z','s']};
const NAMES={a:['a','ay','hey'],b:['b','be','bee'],c:['c','see','sea','she'],d:['d','dee'],e:['e'],f:['f','ef'],g:['g','gee'],h:['h','age'],i:['i','eye','aye'],j:['j','jay'],k:['k','kay','okay'],l:['l','el','elle'],m:['m','em'],n:['n','en','and'],o:['o','oh'],p:['p','pee','pea'],q:['q','cue','queue'],r:['r','are','our'],s:['s','yes'],t:['t','tea','tee'],u:['u','you'],v:['v','we'],w:['w'],x:['x','ex','ax'],y:['y','why'],z:['z','zee','zed']};
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function judge(l,alts){
  const word=l.word.replace(/[^a-z]/g,'');
  for(const raw of alts){
    const text=String(raw||'').toLowerCase();
    const flat=text.replace(/[^a-z]/g,'');
    if(!flat)continue;
    if(flat.includes(word))return true;
    const toks=text.split(/[^a-z]+/).filter(Boolean);
    for(const t of toks){
      if(word.length>=5&&lev(t,word)<=Math.floor(word.length*0.34))return true;
      if(NAMES[l.k].includes(t))return true;
      if(l.k==='x'){if(/x|ks$|cks$/.test(t))return true;continue;}
      if(SAME[l.k].some(p=>t.startsWith(p)))return true;
    }
  }
  return false;
}
function listen(l,onHeard){
  return new Promise(res=>{
    if(!SR)return res({k:'unsupported',alts:[]});
    let r;try{r=new SR();}catch(e){return res({k:'unsupported',alts:[]});}
    r.lang='en-US';r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
    let alts=[],done=false,to=null;
    const verdict=()=>alts.join('').trim()?(judge(l,alts)?'ok':'wrong'):'nospeech';
    const fin=k=>{if(done)return;done=true;clearTimeout(to);try{r.abort();}catch(e){}res({k,alts});};
    r.onresult=e=>{
      alts=[];for(const re of e.results)for(let j=0;j<re.length;j++)alts.push(re[j].transcript);
      onHeard&&onHeard(e.results[0]&&e.results[0][0]?e.results[0][0].transcript:'');
      if(judge(l,alts))fin('ok');else if(e.results[e.results.length-1].isFinal)fin(verdict());
    };
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')fin('denied');else if(e.error==='no-speech')fin('nospeech');else fin(verdict());};
    r.onend=()=>fin(verdict());
    to=setTimeout(()=>{try{r.stop();}catch(e){}},6000);
    try{r.start();}catch(e){fin('unsupported');}
  });
}
/* play the model clip for one letter from the short video; call it straight from a tap */
function playModel(l){
  const tok=stopAll();prepQV('quick');
  const start=QSTART[l.i],stop=QSTART[l.i+1]-0.04;
  return new Promise(res=>{
    let fin=false;
    const done=r=>{if(fin)return;fin=true;qv.removeEventListener('ended',onEnd);res(r);};
    const onEnd=()=>done(tok===playTok);
    qv.addEventListener('ended',onEnd);
    const seek=()=>{hideUntilFrame(qv,start);try{qv.currentTime=start;}catch(e){}};
    if(qv.readyState>=1)seek();else qv.addEventListener('loadedmetadata',seek,{once:true});
    const pr=qv.play();if(pr&&pr.catch)pr.catch(()=>done('blocked'));
    const tick=()=>{if(fin)return;if(tok!==playTok){done(false);return;}
      if(qv.currentTime>=stop&&qv.currentTime<stop+5){qv.pause();done(true);return;}
      requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  });
}
function voiceCard(){

    btn('alt','もういっかい',()=>{it.tries++;miss();vd.className='verdict again';vd.textContent='もういっかい！';boop();watch();});

  function watch(){
    bt.innerHTML='';pb.hidden=true;vd.textContent='';vd.className='verdict';

      if(my!==session)return;

    });
  }
  async function talk(){
    stopAll();bt.innerHTML='';hd.textContent='';
    const m=btn('mic listening','🎤 きいてるよ…',()=>{});m.disabled=true;
    const r=await listen(l,t=>{hd.textContent=t?'「'+t+'」':'';});

    it.tries++;
    if(r.k==='nospeech'){vd.className='verdict again';vd.textContent='きこえなかったよ。もういっかい！';boop();ready();return;}
    miss();boop();vd.className='verdict again';vd.textContent='もういっかい！';ready();
  }

/* the question clip from the teacher-only video; resolves 'blocked' if the browser wants a tap first */
function playMasked(l,mode){
  /* mode: 'sounds' = アアア, 'word' = アアア apple, 'full' = アアア apple apple アアア (the original order) */
  const tok=stopAll();if(!qq.getAttribute('src'))qq.src='quizf.mp4';
  const start=QF_S[l.i];
  const stop=mode==='sounds'?QF_W0[l.i]:mode==='word'?QF_W1[l.i]:QF_E[l.i];
  return new Promise(res=>{
    let fin=false;
    const done=r=>{if(fin)return;fin=true;qq.removeEventListener('ended',onEnd);res(r);};
    const onEnd=()=>done(tok===playTok);
    qq.addEventListener('ended',onEnd);
    const seek=()=>{hideUntilFrame(qq,start);try{qq.currentTime=start;}catch(e){}};
    if(qq.readyState>=1)seek();else qq.addEventListener('loadedmetadata',seek,{once:true});
    const pr=qq.play();if(pr&&pr.catch)pr.catch(()=>done('blocked'));
    const tick=()=>{if(fin)return;if(tok!==playTok){done(false);return;}
      if(qq.currentTime>=stop&&qq.currentTime<stop+5){qq.pause();done(true);return;}
      requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  });
}
function prepQV(type){const src=VIDEOS[type||P().video||'names'].src;if(qv.dataset.src!==src){qv.dataset.src=src;qv.src=src;try{qv.load();}catch(e){}}}
/* hide the video until the frame at the new position is actually on screen, so the previous clip's last frame never flashes */
function hideUntilFrame(v,target){
  if(v.readyState>=2&&Math.abs(v.currentTime-target)<0.05){v.style.opacity='';return;}
  v.style.opacity='0';
  let done=false;
  const show=()=>{if(done)return;done=true;v.removeEventListener('seeked',onSeeked);v.style.opacity='';};
  const onSeeked=()=>{
    if(Math.abs(v.currentTime-target)>0.5)return;
    if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(()=>show());else setTimeout(show,150);
    setTimeout(show,700);
  };
  v.addEventListener('seeked',onSeeked);
  setTimeout(show,2500);
}
/* play one letter's part of the chosen video; call it straight from a tap */
function playLetterClip(l){
  const tok=stopAll();prepQV();
  const type=P().video||'names',V=VIDEOS[type];
  const start=STARTS[type][l.i],stop=l.i<25?STOPS[type][l.i]:Infinity;
  return new Promise(res=>{
    let fin=false;
    const done=r=>{if(fin)return;fin=true;qv.removeEventListener('ended',onEnd);res(r);};
    const onEnd=()=>done(tok===playTok);
    qv.addEventListener('ended',onEnd);
    const seek=()=>{hideUntilFrame(qv,start);try{qv.currentTime=start;}catch(e){}};
    if(qv.readyState>=1)seek();else qv.addEventListener('loadedmetadata',seek,{once:true});
    const pr=qv.play();if(pr&&pr.catch)pr.catch(()=>done('blocked'));
    const tick=()=>{if(fin)return;if(tok!==playTok){done(false);return;}
      if(qv.currentTime>=stop&&qv.currentTime<stop+5){qv.pause();done(true);return;}
      requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  });
}
function sayCard(l,first){
  const my=session;const st=$('#qstage');st.innerHTML='';
  const c=el('div',{class:'say'});
  c.innerHTML=`<div class="yay">${first?'せいかい！ ⭐':'せいかい！'}</div>
    <div class="qvbox" id="qvbox"><button class="qv-play" id="qvplay" aria-label="ビデオを さいせい" hidden>▶</button></div>
    <div class="say-line">${bub(l,'sm')}<span class="emo-sm">${l.emo}</span><span class="ipa">/${l.ipa}/ &nbsp; ${l.word}</span></div>
    <div class="btns"><button class="big alt" id="again">📺 もういちど</button><button class="big" id="next">つぎへ ▶</button></div>`;
  st.appendChild(c);
  c.querySelector('#qvbox').prepend(qv);
  const againB=c.querySelector('#again'),nextB=c.querySelector('#next'),pb=c.querySelector('#qvplay');
  const run=()=>{
    againB.disabled=true;nextB.disabled=true;pb.hidden=true;
    playLetterClip(l).then(async r=>{
      if(my!==session)return;
      if(r==='blocked'){pb.hidden=false;return;}
      if(!r)return;
      await sleep(300);if(my!==session)return;
      againB.disabled=false;nextB.disabled=false;
    });
  };
  pb.addEventListener('click',run);
  againB.addEventListener('click',run);
  nextB.addEventListener('click',()=>{if(nextB.disabled)return;stopAll();Q.i++;if(Q.i>=Q.items.length)finishQuiz();else{renderDots('#qdots',Q.items,Q.i);askQ();}});
  run();
}
function finishQuiz(){
  const best=day().q;const full=mark('q',Math.max(best||0,Q.stars));
  results({title:Q.voice?'こえで こたえる クイズ':'おとあてクイズ',stars:Q.stars,of:Q.items.length,weak:Object.keys(Q.miss).map(k=>BY[k]),full});
}
$('#m-quiz-tap').addEventListener('click',startQuiz);
$('#m-quiz-voice').addEventListener('click',startVoice);

/* ---------- mimic (say it in rhythm) ---------- */
let M=null;
function startMimic(){
  const ls=pickWeighted(pool(),Math.min(5,pool().length));
  while(ls.length<5)ls.push(pool()[ls.length%pool().length]);
  M={i:0,items:ls.map(l=>({l,first:true})),stars:0};
  show('mimic');renderDots('#mdots',M.items,M.i);mimicCard();
}
const BEAT=650;
async function mimicCard(){
  const my=session;const it=M.items[M.i],l=it.l;const st=$('#mstage');st.innerHTML='';
  const c=el('div',{class:'say'});
  c.innerHTML=`<div class="row">${bub(l)}<span class="emo">${l.emo}</span></div>
    <div class="ipa">/${l.ipa}/ &nbsp; ${l.word}</div>
    <div class="turn" id="mt">じゅんびは いい？</div>
    <div class="beats" id="mb"></div>
    <p class="hint">ビデオの ポーズも いっしょに しよう 🙌</p>
    <div class="btns" id="mbtns"><button class="big" id="mstart">▶ スタート</button></div>`;
  st.appendChild(c);
  const mt=c.querySelector('#mt'),mb=c.querySelector('#mb'),btns=c.querySelector('#mbtns');
  const setBeats=(arr)=>{mb.innerHTML='';arr.forEach(a=>mb.appendChild(el('i',{class:a.cls},a.t)));return [...mb.children];};
  async function routine(){
    const tok=stopAll();const gone=()=>tok!==playTok||my!==session;
    btns.innerHTML='';
    // 1) teacher x3
    mt.className='turn';mt.textContent='せんせいの ばん 👂';
    let bs=setBeats([{t:'1'},{t:'2'},{t:'3'}]);
    for(let i=0;i<3;i++){if(gone())return;bs[i].classList.add('hit');const p=snd(l);await Promise.all([p,sleep(BEAT)]);}
    await sleep(350);if(gone())return;
    // 2) kid x3
    mt.className='turn you';mt.textContent=`きみの ばん！ 「/${l.ipa}/」 を 3かい 🗣️`;
    bs=setBeats([{t:'1',cls:'you'},{t:'2',cls:'you'},{t:'3',cls:'you'}]);
    await sleep(500);
    for(let i=0;i<3;i++){if(gone())return;bs[i].classList.add('hit');tone([660],.05,'square',.06);await sleep(BEAT+150);}
    await sleep(250);if(gone())return;
    // 3) word: teacher then kid
    mt.className='turn';mt.textContent='ことばも きいてね 👂';
    bs=setBeats([{t:l.word,cls:'wbeat'}]);bs[0].classList.add('hit');await wrd(l);await sleep(300);if(gone())return;
    mt.className='turn you';mt.textContent=`きみの ばん！ 「${l.word}」 🗣️`;
    bs=setBeats([{t:l.word,cls:'wbeat you'}]);await sleep(250);bs[0].classList.add('hit');tone([660],.05,'square',.06);
    await sleep(1400);if(gone())return;
    mt.className='turn';mt.textContent='おおきな こえで いえたかな？';
    btns.innerHTML='';
    const ok=el('button',{class:'big gold'},'いえた！ ⭐');const again=el('button',{class:'big alt'},'もういっかい');
    btns.append(again,ok);
    again.addEventListener('click',()=>{it.first=false;routine();});
    ok.addEventListener('click',()=>{stopAll();ding();M.stars++;stat(l.k)[0]+=0.5;save();M.i++;
      if(M.i>=M.items.length){const full=mark('m',1);results({title:'まねっこボイス',stars:M.stars,of:M.items.length,weak:[],full});}
      else{renderDots('#mdots',M.items,M.i);mimicCard();}});
  }
  c.querySelector('#mstart').addEventListener('click',routine);
}


/* ---------- ABC board ---------- */
function renderBoard(){
  const g=$('#bgrid');g.innerHTML='';
  LETTERS.forEach(l=>{
    const [c,w]=stat(l.k);const tot=c+w;const pct=tot?Math.round(c/tot*100):0;
    const t=el('button',{class:'tile'+(w>c&&w>0?' weak':''),'aria-label':l.U+' '+l.word},`${bub(l)}<span class="e">${l.emo}</span><span class="meter"><b style="width:${pct}%"></b></span>`);
    t.addEventListener('click',async()=>{
      const sh=$('#bsheet');sh.hidden=false;
      sh.innerHTML=`<div class="sheet"><span class="bub" style="--c:${l.col};font-size:84px">${l.U}${l.k}</span><span style="font-size:72px">${l.emo}</span>
        <div style="display:flex;flex-direction:column;gap:8px"><span style="font-family:var(--f-letter);font-size:26px">/${l.ipa}/ &nbsp; ${l.word}</span>
        <div class="btns" style="justify-content:flex-start"><button class="big alt" id="bplay" style="font-size:18px;padding:10px 18px">🔊 きく</button><button class="big" id="bvid" style="font-size:18px;padding:10px 18px">📺 ビデオでみる</button></div></div></div>`;
      sh.querySelector('#bplay').addEventListener('click',()=>sayBoth(l));
      sh.querySelector('#bvid').addEventListener('click',()=>openVideo(l.i));
      sayBoth(l);
    });
    g.appendChild(t);
  });
}
$('#go-board').addEventListener('click',()=>{show('board');$('#bsheet').hidden=true;renderBoard();});

/* ---------- results & confetti ---------- */
function results({title,stars,of,weak,full}){
  show('result');fanfare();confetti();
  const r=$('#rstage');
  const msg=stars===of?'パーフェクト！ すごい！':stars>=of*0.7?'よく できました！':'がんばったね！ また やろう';
  r.innerHTML=`<p class="label" style="margin:0">${title}</p>
    <div class="bigstars">⭐ ${stars} / ${of}</div>
    <div class="yay">${msg}</div>
    ${full?'<div class="prompt">🌟 きょうの ミッション ぜんぶ クリア！ スタンプ ゲット！</div>':''}
    ${weak.length?'<p class="hint">もういちど きいてみよう（タッチ）</p><div class="weak-list" id="wl"></div>':''}
    <div class="btns"><button class="big" id="rhome">ホームへ</button></div>`;
  const wl=r.querySelector('#wl');
  weak.forEach(l=>{const b=el('button',{},`${bub(l)}<span style="font-size:34px">${l.emo}</span>`);b.addEventListener('click',()=>sayBoth(l));wl.appendChild(b);});
  r.querySelector('#rhome').addEventListener('click',()=>show('home'));
}
function celebrateDay(){results({title:'ビデオ',stars:1,of:1,weak:[],full:true});}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti');cv.hidden=false;const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cols=LETTERS.map(l=>l.col);const ps=Array.from({length:110},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function tick(){g.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore();});if(++f<200)requestAnimationFrame(tick);else{cv.hidden=true;}})();
}

/* ---------- parent settings (passcode 0000) ---------- */
const PASS='0000';let pinBuf='';
function renderPin(){[...$('#pin').children].forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));}
function openLock(){pinBuf='';renderPin();$('#lock').hidden=false;}
function closeLock(){$('#lock').hidden=true;pinBuf='';}
(function(){const k=$('#keys');['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(x=>{
  const b=el('button',{class:x?'':'blank','aria-label':x==='⌫'?'けす':x||'none'},x);if(!x)b.tabIndex=-1;
  b.addEventListener('click',()=>{
    if(x==='⌫'){pinBuf=pinBuf.slice(0,-1);renderPin();return;}
    if(!x||pinBuf.length>=4)return;
    pinBuf+=x;renderPin();
    if(pinBuf.length===4){
      if(pinBuf===PASS){setTimeout(()=>{closeLock();openSettings();},150);}
      else{const p=$('#pin');p.classList.remove('bad');void p.offsetWidth;p.classList.add('bad');boop();setTimeout(()=>{pinBuf='';renderPin();},400);}
    }
  });k.appendChild(b);});})();
document.querySelectorAll('.openSet').forEach(b=>b.addEventListener('click',openLock));
$('#lockClose').addEventListener('click',closeLock);
const AVATARS=['🐣','🦊','🐼','🐸','🦄','🐯','🐰','🐻','🐧','🦖'];
function openSettings(){show('settings');renderSettings();}
function renderSettings(){
  const g=$('#setPlayers');g.innerHTML='';
  S.players.forEach((p,i)=>{
    const c=el('div',{class:'set-card'});
    c.innerHTML=`<h3>プレイヤー ${i+1}${EMBED?'：'+String(p.name).replace(/[&<>]/g,''):''}</h3>
      <label class="field"><span>なまえ</span><input id="setname${i}" maxlength="12" autocomplete="off"></label>
      <div class="field"><span>アイコン</span><div class="avs"></div></div>
      <div class="field"><span>クイズのむずかしさ</span><div class="seg" role="group"><button data-lv="easy">やさしい（3択）</button><button data-lv="normal">ふつう（4択）</button></div></div>
      <div class="field"><span>ビデオ（ミッション1とクイズの正解時）</span><div class="seg" role="group"><button data-vd="sounds">おと だけ</button><button data-vd="names">なまえ ＋ おと</button></div></div>
      <div class="field"><span>「きいて えらぶ」クイズの おと</span><div class="seg col" role="group"><button data-qs="sounds">アアア</button><button data-qs="word">アアア apple</button><button data-qs="full">アアア apple apple アアア</button></div></div>
      <div class="field"><span>「きいて えらぶ」クイズの ビデオ</span><div class="seg" role="group"><button data-qv="off">なし（おとだけ）</button><button data-qv="on">あり（もじは かくす）</button></div></div>
      <button class="reset">きろくを けす</button>`;
    const inp=c.querySelector('input');inp.value=p.name;
    inp.addEventListener('input',()=>{const v=inp.value.trim();if(v){p.name=v;save();}});
    inp.addEventListener('blur',()=>{if(!inp.value.trim())inp.value=p.name;});
    const avs=c.querySelector('.avs');
    AVATARS.forEach(a=>{const b=el('button',{'aria-pressed':String(p.avatar===a),'aria-label':'アイコン'},a);b.addEventListener('click',()=>{p.avatar=a;save();avs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});avs.appendChild(b);});
    const sync=()=>{c.querySelectorAll('[data-lv]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lv===p.level)));c.querySelectorAll('[data-vd]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.vd===p.video)));c.querySelectorAll('[data-qs]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.qs===(p.qsound||'full'))));c.querySelectorAll('[data-qv]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.qv===(p.qvideo||'on'))));};
    c.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>{p.level=b.dataset.lv;save();sync();}));
    c.querySelectorAll('[data-vd]').forEach(b=>b.addEventListener('click',()=>{p.video=b.dataset.vd;save();sync();}));
    c.querySelectorAll('[data-qs]').forEach(b=>b.addEventListener('click',()=>{p.qsound=b.dataset.qs;save();sync();}));
    c.querySelectorAll('[data-qv]').forEach(b=>b.addEventListener('click',()=>{p.qvideo=b.dataset.qv;save();sync();}));
    sync();
    const r=c.querySelector('.reset');let tmr;
    r.addEventListener('click',()=>{
      if(!r.classList.contains('arm')){r.classList.add('arm');r.textContent='もう一度押すと消えます';clearTimeout(tmr);tmr=setTimeout(()=>{r.classList.remove('arm');r.textContent='きろくを けす';},3000);return;}
      p.days={};p.stats={};save();r.classList.remove('arm');r.textContent='消しました';
    });
    g.appendChild(c);
  });
}

window.PHON={
  sync(names,cur){names.forEach((n,i)=>{if(S.players[i]&&n)S.players[i].name=n});S.cur=cur;save();},
  unlock(){try{unlock()}catch(e){}},
  quiz(){startQuiz()},
  video(){openVideo(null)},
  settings(){openSettings()},
  stop(){session++;stopAll();const v=$('#vid');if(!v.paused)v.pause();},
  get(i){const p=S.players[i];if(!p)return null;return {level:p.level||'easy',video:p.video||'names',qsound:p.qsound||'full',qvideo:p.qvideo||'on',stats:JSON.parse(JSON.stringify(p.stats||{})),vdays:Object.values(p.days||{}).filter(d=>d&&d.v).length};},
  set(i,o){const p=S.players[i];if(!p)return;Object.assign(p,o);save();},
  reset(i){const p=S.players[i];if(!p)return;p.stats={};save();},
  clearVideo(i){const p=S.players[i];if(!p)return;Object.values(p.days||{}).forEach(d=>{if(d)delete d.v});save();}
};
if(!EMBED)show('who');
})();
